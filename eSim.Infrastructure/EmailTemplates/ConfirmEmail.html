<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Confirm your e-mail</title>
</head>
<body style="margin:0;padding:0;background:#f4f7fb;">
    <center style="width:100%;background:#f4f7fb;">
        <table role="presentation" width="700" cellpadding="0" cellspacing="0" border="0" style="width:700px;max-width:700px;margin:0 auto;background:#ffffff;">
            <!-- HEADER BANNER -->
            <tr>
                <td style="padding:0; margin:0; font-size:0; line-height:0;">
                    <img src="cid:email_banner"
                         alt="Mobysim"
                         width="700"
                         height="auto"
                         style="display:block; width:100%; max-width:700px; height:auto; border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic;" />
                </td>
            </tr>

            <!-- Title -->
            <tr>
                <td align="center" style="padding:22px 24px 6px 24px;font-family:Arial,Helvetica,sans-serif;">
                    <div style="font-size:28px;font-weight:800;color:#0e2d3d;">Confirm your e-mail</div>
                </td>
            </tr>

            <!-- Copy -->
            <tr>
                <td style="padding:0 28px 18px 28px;font-family:Arial,Helvetica,sans-serif;color:#123f56;font-size:16px;text-align:center;">
                    <p style="margin:0 0 6px 0;"><strong>Hello {{CustomerName}},</strong></p>
                    <p style="margin:0;">Thanks for creating a MobySIM account. Please confirm your e-mail address by clicking the button below.</p>
                </td>
            </tr>

            <!-- CTA button (bulletproof) -->
            <tr>
                <td align="center" style="padding:6px 28px 26px 28px;">
                    <a href="{{ConfirmUrl}}" style="background:#0fb6b0;border-radius:999px;color:#ffffff;display:inline-block;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;line-height:44px;text-align:center;text-decoration:none;width:240px;mso-hide:all;">Confirm E-mail</a>
                </td>
            </tr>

            <!-- Note -->
            <tr>
                <td style="padding:0 28px 28px 28px;font-family:Arial,Helvetica,sans-serif;color:#5a6a75;font-size:13px;text-align:center;">
                    If you didn’t request this, you can safely ignore this e-mail.
                </td>
            </tr>

            <!-- Footer -->
            <tr>
                <td style="padding:0; margin:0;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0a2f3f;">
                        <!-- Centered logo -->
                        <tr>
                            <td align="center" style="padding:22px 20px 10px 20px;">
                                <img src="cid:footer_logo"
                                     alt="MobySIM"
                                     style="display:block; width:150px; max-width:150px; height:auto; border:0; outline:none; text-decoration:none;" />
                            </td>
                        </tr>
                        <!-- Centered text -->
                        <tr>
                            <td align="center" style="padding:0 20px 24px 20px; font-family:Arial,Helvetica,sans-serif; font-size:13px; color:#bfe9f5;">
                                Connected by MobySIM.
                                <a href="{{WebsiteTermsUrl}}" style="color:#bfe9f5; text-decoration:none;">Website terms</a>
                                <span style="color:#69bfd4;">&nbsp;|&nbsp;</span>
                                <a href="{{PrivacyPolicyUrl}}" style="color:#bfe9f5; text-decoration:none;">Privacy Policy</a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

        </table>
    </center>
</body>
</html>
